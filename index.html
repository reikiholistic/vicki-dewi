<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AI Evaluator Simbol Reiki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6; /* Latar abu-abu untuk area di luar "layar HP" */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; 
            overscroll-behavior-y: none; /* Mencegah efek pull-to-refresh di browser HP */
        }
        #drawingCanvas {
            background-color: #ffffff;
            cursor: crosshair;
            touch-action: none;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8b5cf6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Memastikan container mengambil full height presisi di HP */
        body, html {
            height: 100%;
            margin: 0;
            background-color: #f3f4f6;
        }
        .mobile-container {
            height: 100vh; /* Fallback browser lama */
            height: 100dvh; /* Presisi di HP (mengabaikan navbar browser) */
            width: 100%;
        }
        @media (min-width: 640px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .mobile-container {
                height: 850px;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body class="font-sans">

    <!-- Mobile App Container (Layar HP) -->
    <div class="bg-white w-full max-w-md mx-auto mobile-container flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[2.5rem] sm:border-[8px] sm:border-gray-800">
        
        <!-- Header (Fixed di atas) -->
        <div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-5 text-white text-center z-10 shadow-md flex-shrink-0">
            <h1 class="text-xl font-bold mb-1"><i class="fas fa-yin-yang mr-2"></i>Reiki Symbol AI</h1>
            <p class="text-purple-100 text-xs font-medium">Latih & Koreksi Simbol via HP</p>
        </div>

        <!-- Scrollable Content (Area Konten yang Bisa Digulir) -->
        <div class="flex-1 overflow-y-auto p-5 pb-28">
            <!-- Pilih Simbol -->
            <div class="mb-5">
                <label for="symbolSelect" class="block text-sm font-bold text-gray-700 mb-2">Pilih Simbol Pelatihan:</label>
                <select id="symbolSelect" onchange="updateReference()" class="block w-full px-4 py-3 border-2 border-purple-100 rounded-xl focus:ring-purple-500 focus:border-purple-500 bg-gray-50 font-semibold text-gray-800 shadow-sm appearance-none">
                    <option value="Cho Ku Rei">Cho Ku Rei (Power Symbol)</option>
                    <option value="Sei He Ki">Sei He Ki (Mental/Emotional Symbol)</option>
                    <option value="Hon Sha Ze Sho Nen">Hon Sha Ze Sho Nen (Distance Symbol)</option>
                </select>
            </div>

            <!-- Area Referensi Gambar -->
            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-2">Gambar Acuan:</label>
                <div class="w-full bg-purple-50 border-2 border-dashed border-purple-300 rounded-xl p-2 flex justify-center shadow-inner">
                    <img id="referenceImage" crossorigin="anonymous" src="https://dl.dropboxusercontent.com/scl/fi/2ikdcmf9qmvsck4j9bcfj/IMG-20230126-WA0016.jpg?rlkey=bekf4ow7iig3r8rt01g8cp89i" alt="Reference Symbol" class="max-h-32 object-contain rounded-lg">
                </div>
            </div>

            <!-- Mode Input Pilihan -->
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">Metode Input:</label>
                <div class="grid grid-cols-3 gap-1 bg-gray-100 p-1.5 rounded-xl border border-gray-200 shadow-inner">
                    <button id="tab-draw" onclick="setMode('draw')" class="py-2.5 text-xs font-bold rounded-lg bg-white shadow text-purple-700 transition-all">✏️ Gambar</button>
                    <button id="tab-upload" onclick="setMode('upload')" class="py-2.5 text-xs font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-all">📁 Unggah</button>
                    <button id="tab-camera" onclick="setMode('camera')" class="py-2.5 text-xs font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-all">📷 Kamera</button>
                </div>
            </div>

            <!-- Area Menggambar / Input -->
            <div class="mb-2">
                <div class="flex justify-between items-end mb-2 px-1">
                    <label id="inputLabel" class="block text-sm font-bold text-gray-700">Gambar di Sini:</label>
                    <button onclick="clearCanvas()" class="text-xs text-red-600 hover:text-red-800 font-bold bg-red-50 px-3 py-1.5 rounded-full border border-red-100 active:bg-red-100">
                        <i class="fas fa-eraser mr-1"></i> Bersihkan
                    </button>
                </div>
                
                <!-- Aspect Square untuk Mobile (Kotak Presisi) -->
                <div class="relative w-full aspect-square max-h-[400px]">
                    <!-- Input File Hidden -->
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
                    
                    <!-- Kamera Container -->
                    <div id="cameraContainer" class="hidden flex-col items-center justify-center w-full h-full bg-black rounded-2xl overflow-hidden relative shadow-inner">
                        <video id="cameraFeed" autoplay playsinline class="w-full h-full object-cover"></video>
                        <button onclick="captureCamera()" class="absolute bottom-6 bg-white text-purple-700 px-6 py-3 rounded-full font-bold shadow-2xl flex items-center border-2 border-purple-100 active:scale-95 transition-transform">
                            <i class="fas fa-camera mr-2 text-lg"></i> Ambil Foto
                        </button>
                    </div>

                    <!-- Canvas -->
                    <canvas id="drawingCanvas" class="shadow-sm rounded-2xl w-full h-full border-2 border-purple-200 bg-white"></canvas>
                </div>
            </div>

            <!-- Area Loading -->
            <div id="loadingArea" class="hidden py-8 flex-col items-center justify-center bg-purple-50 rounded-2xl mt-6 border border-purple-100 shadow-sm">
                <div class="loader mb-3"></div>
                <p class="text-purple-700 text-sm font-bold animate-pulse">AI sedang menganalisis...</p>
            </div>

            <!-- Area Hasil -->
            <div id="resultArea" class="hidden bg-gray-50 p-5 rounded-2xl border border-gray-200 mt-6 shadow-sm">
                <h2 class="text-md font-bold text-gray-800 mb-3 border-b pb-2">Hasil Evaluasi AI</h2>
                
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-bold text-gray-500">Tingkat Akurasi:</span>
                        <span id="scoreBadge" class="px-3 py-1 rounded-full text-sm font-bold bg-green-100 text-green-700">0%</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-3 mb-1 overflow-hidden">
                        <div id="scoreBar" class="bg-green-600 h-3 rounded-full" style="width: 0%"></div>
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h3 class="text-sm font-bold text-blue-800 mb-2"><i class="fas fa-comment-medical mr-1"></i> Umpan Balik:</h3>
                    <p id="feedbackText" class="text-sm text-gray-700 leading-relaxed font-medium">
                        <!-- Feedback text will appear here -->
                    </p>
                    <!-- Area untuk titik kesalahan spesifik -->
                    <div id="feedbackPoints" class="mt-3"></div>
                </div>
            </div>
            
            <!-- Area Error -->
            <div id="errorArea" class="hidden bg-red-50 p-4 rounded-xl border border-red-200 mt-6">
                 <p id="errorText" class="text-sm text-red-600 text-center font-bold"></p>
            </div>
        </div>

        <!-- Fixed Bottom Action Bar (Tombol Menempel di Bawah) -->
        <div class="absolute bottom-0 w-full bg-white border-t border-gray-200 p-4 pb-6 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-20 sm:rounded-b-[2.5rem]">
            <button id="submitBtn" onclick="evaluateSymbol()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-4 px-4 rounded-xl transition duration-200 flex justify-center items-center shadow-lg active:scale-[0.98]">
                <i class="fas fa-magic text-xl mr-2"></i> Evaluasi Simbol
            </button>
        </div>
    </div>

    <script>
        // --- REFERENSI GAMBAR ---
        const referenceLinks = {
            "Cho Ku Rei": "https://dl.dropboxusercontent.com/scl/fi/2ikdcmf9qmvsck4j9bcfj/IMG-20230126-WA0016.jpg?rlkey=bekf4ow7iig3r8rt01g8cp89i",
            "Sei He Ki": "https://dl.dropboxusercontent.com/scl/fi/zr4rsexa7b1zo23pp3pg2/IMG-20230126-WA0014.jpg?rlkey=8how9xshrd090p6a2lz8zjr47",
            "Hon Sha Ze Sho Nen": "https://dl.dropboxusercontent.com/scl/fi/uu5926877zsgayez6tikt/IMG-20230126-WA0015.jpg?rlkey=pgc5au90m8l8dnk3petremydj"
        };

        function updateReference() {
            const sym = document.getElementById('symbolSelect').value;
            // Gadziridza mufananidzo zvichienderana nesarudzo
            document.getElementById('referenceImage').src = referenceLinks[sym];
        }

        // --- SETUP CANVAS MENGGAMBAR ---
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let isDrawing = false;
        let currentMode = 'draw';
        let cameraStream = null;

        // Sesuaikan ukuran canvas internal dengan ukuran tampilan CSS
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height; // Menggunakan aspect ratio square dari container
            
            // Set background putih (penting untuk konversi gambar AI)
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Style kuas
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1e293b'; // Warna tinta gelap
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Event Listeners untuk Mouse
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', endPosition);

        // Event Listeners untuk Touch (Mobile)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousedown", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const mouseEvent = new MouseEvent("mouseup", {});
            canvas.dispatchEvent(mouseEvent);
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousemove", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, { passive: false });

        function startPosition(e) {
            isDrawing = true;
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function clearCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('errorArea').classList.add('hidden');
            
            if (currentMode === 'upload') {
                document.getElementById('imageUpload').value = '';
            }
        }

        // --- SETUP MODE INPUT (GAMBAR, UNGGAH, KAMERA) ---
        function setMode(mode) {
            currentMode = mode;
            const tabDraw = document.getElementById('tab-draw');
            const tabUpload = document.getElementById('tab-upload');
            const tabCamera = document.getElementById('tab-camera');
            const cameraContainer = document.getElementById('cameraContainer');
            const inputLabel = document.getElementById('inputLabel');
            
            // Reset tab styles
            [tabDraw, tabUpload, tabCamera].forEach(tab => {
                tab.className = 'py-2.5 text-xs font-bold rounded-lg text-gray-500 hover:text-gray-700 transition-all';
            });

            // Stop camera if running
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            cameraContainer.classList.add('hidden');
            canvas.classList.remove('hidden');

            if (mode === 'draw') {
                tabDraw.className = 'py-2.5 text-xs font-bold rounded-lg bg-white shadow text-purple-700 transition-all';
                inputLabel.textContent = 'Gambar di Sini:';
                clearCanvas();
            } else if (mode === 'upload') {
                tabUpload.className = 'py-2.5 text-xs font-bold rounded-lg bg-white shadow text-purple-700 transition-all';
                inputLabel.textContent = 'Preview Gambar (Bisa dicoret):';
                document.getElementById('imageUpload').click();
            } else if (mode === 'camera') {
                tabCamera.className = 'py-2.5 text-xs font-bold rounded-lg bg-white shadow text-purple-700 transition-all';
                inputLabel.textContent = 'Arahkan Kamera ke Kertas:';
                canvas.classList.add('hidden');
                cameraContainer.classList.remove('hidden');
                cameraContainer.classList.add('flex');
                startCamera();
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return setMode('draw'); // Fallback if canceled
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    drawImageScaled(img);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function startCamera() {
            try {
                // Mencoba membuka kamera belakang jika tersedia (cocok untuk memindai dokumen)
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                document.getElementById('cameraFeed').srcObject = cameraStream;
            } catch (err) {
                console.error("Camera error:", err);
                showError("Kamera tidak dapat diakses. Pastikan Anda telah memberikan izin kamera di browser Anda.");
                setMode('draw');
            }
        }

        function captureCamera() {
            const video = document.getElementById('cameraFeed');
            drawImageScaled(video);
            
            // Matikan kamera dan tampilkan hasil jepretan di Canvas
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            document.getElementById('cameraContainer').classList.add('hidden');
            document.getElementById('cameraContainer').classList.remove('flex');
            canvas.classList.remove('hidden');
            document.getElementById('inputLabel').textContent = 'Hasil Foto (Bisa dicoret):';
        }

        // Fungsi khusus untuk menggambar foto/kamera agar pas (proporsional) ke dalam canvas
        function drawImageScaled(imgOrVideo) {
            clearCanvas(); // Bersihkan kanvas dulu
            
            const srcWidth = imgOrVideo.videoWidth || imgOrVideo.width;
            const srcHeight = imgOrVideo.videoHeight || imgOrVideo.height;
            
            const hRatio = canvas.width / srcWidth;
            const vRatio = canvas.height / srcHeight;
            const ratio  = Math.min(hRatio, vRatio); 
            
            const renderWidth = srcWidth * ratio;
            const renderHeight = srcHeight * ratio;
            const centerShiftX = (canvas.width - renderWidth) / 2;
            const centerShiftY = (canvas.height - renderHeight) / 2;  
            
            ctx.drawImage(imgOrVideo, 0, 0, srcWidth, srcHeight, centerShiftX, centerShiftY, renderWidth, renderHeight);  
        }

        // --- SETUP AI EVALUATION ---
        // Kunci API dikosongkan karena akan diisi oleh environment otomatis
        const apiKey = ""; 

        // Fungsi dengan Exponential Backoff untuk mengatasi limitasi API
        async function fetchWithRetry(url, options, maxRetries = 5) {
            let delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function evaluateSymbol() {
            const symbolSelected = document.getElementById('symbolSelect').value;
            const loadingArea = document.getElementById('loadingArea');
            const resultArea = document.getElementById('resultArea');
            const errorArea = document.getElementById('errorArea');
            const submitBtn = document.getElementById('submitBtn');

            // Cek apakah canvas kosong (hanya putih)
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let isBlank = true;
            for (let i = 0; i < imageData.length; i += 4) {
                if (imageData[i] !== 255 || imageData[i+1] !== 255 || imageData[i+2] !== 255) {
                    isBlank = false;
                    break;
                }
            }

            if (isBlank) {
                showError("Silakan gambar simbol terlebih dahulu sebelum mengevaluasi.");
                return;
            }

            // Siapkan UI Loading
            errorArea.classList.add('hidden');
            resultArea.classList.add('hidden');
            loadingArea.classList.remove('hidden');
            loadingArea.classList.add('flex');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // Ambil gambar dari canvas dan ubah ke Base64 (buang prefix data:image/png;base64,)
                const dataURL = canvas.toDataURL("image/png");
                const base64Image = dataURL.split(',')[1];

                // Ambil base64 gambar referensi
                let refBase64 = null;
                try {
                    const refImg = document.getElementById('referenceImage');
                    const tempCanvas = document.createElement("canvas");
                    tempCanvas.width = refImg.naturalWidth;
                    tempCanvas.height = refImg.naturalHeight;
                    const tempCtx = tempCanvas.getContext("2d");
                    tempCtx.drawImage(refImg, 0, 0);
                    refBase64 = tempCanvas.toDataURL("image/jpeg").split(',')[1];
                } catch(e) {
                    console.log("Gagal mengambil gambar referensi (CORS issue)", e);
                }

                // Prompt Instruksi Khusus untuk AI
                const promptText = `Anda adalah Master Reiki ahli. Pengguna baru saja menggambar simbol Reiki: "${symbolSelected}". 
Tugas Anda adalah mengevaluasi gambar pertama (coretan pengguna) dengan membandingkannya secara ketat terhadap gambar kedua (gambar acuan/referensi).
1. Berikan skor akurasi (0-100) berdasarkan proporsi, arah guratan, dan keutuhan simbol dibandingkan dengan gambar referensi.
2. Berikan umpan balik yang konstruktif dalam bahasa Indonesia tentang apa yang sudah bagus dan apa yang perlu diperbaiki.
3. Berikan array 'titik_kesalahan' (koordinat x dan y dalam persentase 0-100) beserta keterangan spesifik dalam bahasa Indonesia mengenai ketidaksesuaian dengan referensi. Jika gambar sempurna, kosongkan array ini.`;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                // Siapkan data untuk dikirim
                const requestParts = [
                    { text: promptText },
                    { inlineData: { mimeType: "image/png", data: base64Image } }
                ];

                // Lampirkan gambar acuan jika ada
                if (refBase64) {
                    requestParts.push({ text: "Gambar Acuan (Reference Image):" });
                    requestParts.push({ inlineData: { mimeType: "image/jpeg", data: refBase64 } });
                }

                const payload = {
                    contents: [{
                        role: "user",
                        parts: requestParts
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                skor: { type: "INTEGER", description: "Skor akurasi 0 hingga 100" },
                                umpan_balik: { type: "STRING", description: "Saran perbaikan dan evaluasi dalam bahasa Indonesia" },
                                titik_kesalahan: {
                                    type: "ARRAY",
                                    description: "Daftar titik lokasi kesalahan pada gambar",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            x: { type: "INTEGER", description: "Koordinat X (0-100) persentase" },
                                            y: { type: "INTEGER", description: "Koordinat Y (0-100) persentase" },
                                            keterangan: { type: "STRING", description: "Detail kesalahan di titik ini" }
                                        }
                                    }
                                }
                            },
                            required: ["skor", "umpan_balik"]
                        }
                    }
                };

                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Parse hasil
                const resultText = data.candidates[0].content.parts[0].text;
                const resultJSON = JSON.parse(resultText);

                tampilkanHasil(resultJSON.skor, resultJSON.umpan_balik, resultJSON.titik_kesalahan);

            } catch (error) {
                console.error("AI Error:", error);
                showError("Gagal menghubungi AI. Periksa koneksi internet Anda atau coba beberapa saat lagi.");
            } finally {
                loadingArea.classList.add('hidden');
                loadingArea.classList.remove('flex');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function tampilkanHasil(skor, feedback, titikKesalahan) {
            const resultArea = document.getElementById('resultArea');
            const scoreBadge = document.getElementById('scoreBadge');
            const scoreBar = document.getElementById('scoreBar');
            const feedbackText = document.getElementById('feedbackText');
            const feedbackPoints = document.getElementById('feedbackPoints');

            // Set warna berdasarkan skor
            let colorClass = 'bg-red-600';
            let badgeBg = 'bg-red-100';
            let badgeText = 'text-red-700';

            if (skor >= 80) {
                colorClass = 'bg-green-600';
                badgeBg = 'bg-green-100';
                badgeText = 'text-green-700';
            } else if (skor >= 50) {
                colorClass = 'bg-yellow-500';
                badgeBg = 'bg-yellow-100';
                badgeText = 'text-yellow-700';
            }

            scoreBadge.className = `px-3 py-1 rounded-full text-sm font-bold ${badgeBg} ${badgeText}`;
            scoreBadge.textContent = `${skor}%`;
            
            scoreBar.className = `h-2.5 rounded-full transition-all duration-1000 ${colorClass}`;
            // Set timeout agar animasi CSS bar berjalan
            setTimeout(() => {
                scoreBar.style.width = `${skor}%`;
            }, 100);

            feedbackText.textContent = feedback;
            
            // Render titik kesalahan di UI dan di Canvas
            feedbackPoints.innerHTML = '';
            if (titikKesalahan && titikKesalahan.length > 0) {
                let pointsHTML = '<ul class="space-y-3 mt-4 border-t border-blue-200 pt-3">';
                
                titikKesalahan.forEach((titik, index) => {
                    const num = index + 1;
                    
                    // Tambahkan ke daftar UI (penjelasan titik kesalahan)
                    pointsHTML += `
                        <li class="flex items-start">
                            <span class="flex-shrink-0 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold mr-3 mt-0.5 shadow-sm">${num}</span>
                            <span class="text-sm text-gray-700">${titik.keterangan}</span>
                        </li>
                    `;
                    
                    // Gambar marker di atas Canvas
                    const px = (titik.x / 100) * canvas.width;
                    const py = (titik.y / 100) * canvas.height;
                    
                    ctx.beginPath();
                    ctx.arc(px, py, 15, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ef4444'; // Warna Merah
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(px, py, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ef4444';
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(num, px, py);
                });
                
                pointsHTML += '</ul>';
                feedbackPoints.innerHTML = pointsHTML;
            }

            resultArea.classList.remove('hidden');
        }

        function showError(msg) {
            const errorArea = document.getElementById('errorArea');
            document.getElementById('errorText').textContent = msg;
            errorArea.classList.remove('hidden');
        }
    </script>
</body>
</html>
